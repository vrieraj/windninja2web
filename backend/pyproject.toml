[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "windninja-web-backend"
version = "0.1.0"
description = "WindNinja Web — Backend FastAPI server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "python-multipart>=0.0.6",
    "matplotlib>=3.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
