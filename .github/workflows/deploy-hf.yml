name: Deploy to Hugging Face Spaces

"on":
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Login to Hugging Face
        uses: huggingface/huggingface-cli@v1
        with:
          token: ${{ secrets.HF_TOKEN }}

      - name: Sync to HF Space
        run: |
          git remote add space https://huggingface.co/spaces/${{ secrets.HF_USERNAME }}/windninja-web || true
          git push --force https://huggingface.co/spaces/${{ secrets.HF_USERNAME }}/windninja-web HEAD:main
